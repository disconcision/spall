<title>Spall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   Chrome: the game-pixel look (decided). The open choices are codes on <body>
   (data-mt, data-px, data-bv, …; see UICFG in 80_ui.js); tones are variables
   below, panel frames and dithers are generated by applyChrome().

   Style system: new UI is built from these, so a style change reaches all of it.
   - Colours are tokens. Tone tokens (--ink --dim --faint --acct --field --hov --tipbg …)
     come from the tone blocks; role tokens (--accent --agent --you, and --agent-t
     --you-t for text on the chrome) are defined once with their light-tone inks.
     Write no colour into a rule; build.sh lists any that slip in (mark a deliberate
     one with a raw-colour comment).
   - Surfaces: .pn (framed panel), .bar (flush bar), .ttl (title strip),
     .float (anything hovering over the stage: tips, toasts, speech).
   - Controls: .btn (.go primary, .sm small), .sgc segmented, .tgl toggle,
     .sl slider, .stp stepper, kbd key hint, .chip.
   - Feed items share one row: who · icon · text · time (.lg log, .m message,
     .pr proposal). Times always show; nothing reflows on hover.
   ========================================================================== */
:root{
  color-scheme:dark;
  --bg:#0e0f11; --stage:#0a0b0c; --text:#e6dfcf;
  --accent:#e8a83c; --accent-ink:#1b1305; --agent:#ff7a52; --agent-ink:#2a0f06;
  --you:#5fd3f2; --you-ink:#04222b; --ok:#a3c46c; --bad:#e2573f;
  --shadow:rgba(0,0,0,.55);
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --cond:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --p:2px; --pb:4px; --bs:2; --sbw:300px; --tbh:42px;
}
/* tones (MT): dark grey, light grey, near-white, near-black */
body[data-mt="10"]{--pxo:#0b0a09;--pxL:#6a645a;--pxl:#4f4a41;--pxm:#38342e;--pxf:#26241f;--pxd:#161513;--pxb:#2f2c27;--pxbh:#38342e;
  --ink:#e6dfcf;--dim:#a39c8e;--faint:#80796d;--acct:#e8a83c;--well:#3d3a33;--fillc:#8d877a;--tick:#d9d2c2;--grv:#0d0d0e;--cap:#3d3c3a;
  --afl:rgba(163,156,142,.35);--field:#161513;--hov:rgba(255,255,255,.07);--kbg:#a39c8e;--knock:#26241f;--tipbg:#1c1b18;--sel:rgba(232,168,60,.18);--fade:.36}
body[data-mt="11"]{--pxo:#2a2622;--pxL:#ffffff;--pxl:#fbf8f0;--pxm:#ebe6da;--pxf:#d9d3c4;--pxd:#9a9284;--pxb:#e4dfd2;--pxbh:#ece8dd;
  --ink:#1e1b17;--dim:#4f4a42;--faint:#7c766b;--acct:#8d5404;--well:#bdb6a6;--fillc:#857f74;--tick:#2f2c27;--grv:#b3ab9a;--cap:#fbfaf7;
  --afl:rgba(79,74,66,.4);--field:#f4efe4;--hov:rgba(0,0,0,.06);--kbg:#4a463f;--knock:#d9d3c4;--tipbg:#efe9dc;--sel:rgba(200,128,20,.2);--fade:.42}
body[data-mt="15"]{--pxo:#3b3833;--pxL:#ffffff;--pxl:#ffffff;--pxm:#f8f7f3;--pxf:#f1efe9;--pxd:#c4bfb4;--pxb:#f7f6f2;--pxbh:#ffffff;
  --ink:#1b1916;--dim:#4d4943;--faint:#7d786f;--acct:#8d5404;--well:#d9d5cc;--fillc:#857f74;--tick:#2f2c27;--grv:#cfcac0;--cap:#ffffff;
  --afl:rgba(79,74,66,.4);--field:#ffffff;--hov:rgba(0,0,0,.05);--kbg:#3b3833;--knock:#f1efe9;--tipbg:#f7f6f2;--sel:rgba(200,128,20,.18);--fade:.42}
body[data-mt="16"]{--pxo:#000;--pxL:#3e3c38;--pxl:#2c2b28;--pxm:#1d1c1a;--pxf:#121211;--pxd:#060606;--pxb:#1a1918;--pxbh:#22211f;
  --ink:#e6dfcf;--dim:#a39c8e;--faint:#7a746a;--acct:#e8a83c;--well:#2c2a26;--fillc:#8d877a;--tick:#d9d2c2;--grv:#030303;--cap:#2f2e2c;
  --afl:rgba(163,156,142,.35);--field:#060606;--hov:rgba(255,255,255,.07);--kbg:#a39c8e;--knock:#121211;--tipbg:#121211;--sel:rgba(232,168,60,.18);--fade:.36}
/* role colours as text and washes on the chrome; the light tones need darker inks */
body{--agent-t:#ff7a52;--you-t:#5fd3f2;--world-t:#5fd3c4;--folk:#cdb898;--agent-wash:rgba(255,122,82,.08);--you-wash:rgba(95,211,242,.08);--warn:#ff8a5c}
body[data-mt="11"],body[data-mt="15"]{--bg:var(--pxf);--text:var(--ink);--agent-t:#b8431c;--you-t:#1279a0;--world-t:#1d7d72;--folk:#7d5f36;--agent-wash:rgba(200,80,40,.07);--you-wash:rgba(18,121,160,.07);--warn:#a3301c}   /* band canvases re-ink themselves for light tones (bnInk) */
/* bevels (BV) built from the tone; the panel frames themselves are nine-slice images made in applyChrome() */
body[data-bv="1"]{--bsh:inset var(--p) var(--p) 0 var(--pxl),inset calc(-1*var(--p)) calc(-1*var(--p)) 0 var(--pxd);--press:inset var(--p) var(--p) 0 var(--pxd),inset calc(-1*var(--p)) calc(-1*var(--p)) 0 var(--pxl);
  --barsh:inset 0 var(--p) 0 var(--pxl),inset 0 calc(-1*var(--p)) 0 var(--pxo),inset 0 calc(-2*var(--p)) 0 var(--pxd)}
body[data-bv="2"]{--bsh:inset var(--p) var(--p) 0 var(--pxL),inset calc(-1*var(--p)) calc(-1*var(--p)) 0 var(--pxo),inset calc(2*var(--p)) calc(2*var(--p)) 0 var(--pxm),inset calc(-2*var(--p)) calc(-2*var(--p)) 0 var(--pxd);
  --press:inset var(--p) var(--p) 0 var(--pxo),inset calc(-1*var(--p)) calc(-1*var(--p)) 0 var(--pxL);--barsh:inset 0 var(--p) 0 var(--pxL),inset 0 calc(-1*var(--p)) 0 var(--pxo),inset 0 calc(-2*var(--p)) 0 var(--pxd)}
body[data-bv="3"]{--bsh:inset 0 0 0 var(--p) var(--pxd);--press:inset 0 0 0 var(--p) var(--pxo);--barsh:inset 0 calc(-1*var(--p)) 0 var(--pxd)}
body{--onsh:inset var(--p) var(--p) 0 #ffd889,inset calc(-1*var(--p)) calc(-1*var(--p)) 0 #a3651a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
body{font:12px/1.35 var(--mono);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;color:inherit;text-align:left}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.px{display:block;flex:none;image-rendering:pixelated}
/* key hints (KH2): a filled key, the letter punched out */
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:13px;height:13px;padding:0 3px;font:700 9.5px/1 var(--mono);background:var(--kbg);color:var(--knock);border-radius:2px;flex:none;letter-spacing:0;text-transform:none}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ---- panels and bars ---- */
.pn{border:var(--pb) solid transparent;border-image:var(--px9) var(--bs) fill / var(--pb) / 0 stretch;background:none;filter:drop-shadow(var(--p) var(--p) 0 rgba(0,0,0,.42));color:var(--ink)}
.bar{background:var(--pxf);box-shadow:var(--barsh);color:var(--ink)}
.ttl{background:var(--pxf) var(--dtitle);border-bottom:var(--p) solid var(--pxo);box-shadow:0 var(--p) 0 var(--pxl)}
.ttl b,.ttl .cutv,.ttl>span{text-shadow:0 0 2px var(--pxf),0 0 2px var(--pxf),0 0 4px var(--pxf),0 0 1px var(--pxf)}
.popm .lp-h.ttl,.fo .foh.ttl{color:var(--ink)}
.popm .lp-h.ttl .lp-dim{color:var(--dim)}

/* ---- top bar (TB3: 34px icon segments) ---- */
header.tb{position:relative;z-index:10;display:flex;align-items:stretch;height:var(--tbh);padding:var(--p) 0 calc(2*var(--p));white-space:nowrap;user-select:none;-webkit-user-select:none}
.tb .fill{flex:1;min-width:6px}
.tb .seg{display:flex;align-items:stretch;flex:none;border-left:var(--p) solid var(--pxo)}
.tb .seg>*+*,.tb .split>.caret{border-left:var(--p) solid var(--pxo)}
.tb .b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:100%;padding:0 10px;background:var(--pxb);box-shadow:var(--bsh);color:var(--dim);font:600 12.5px/1 var(--cond);letter-spacing:.07em;text-transform:uppercase;position:relative}
.tb .b:hover{background:var(--pxbh);color:var(--ink)}
.tb .b.ib{width:34px;padding:0}
.tb .b.mode{padding:0 11px 0 9px}
.tb .b.mode[aria-selected="true"]{background:var(--accent);box-shadow:var(--onsh);color:var(--accent-ink)}
.tb .b[aria-pressed="true"]{background:var(--pxf) var(--dith);box-shadow:var(--press);color:var(--acct)}
.tb .split{display:flex;align-items:stretch}
.tb .b.caret{width:18px;padding:0;color:var(--faint)}
.tb .b.caret.open{color:var(--acct)}
.tb .vol{display:flex;align-items:center;padding:0 10px;background:var(--pxb);box-shadow:var(--bsh)}
.tb .vol .sl{--slw:62px}
.tb .b#bHelp .hq{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:inset 0 0 0 1px var(--afl);font:700 10px/1 var(--mono);text-transform:none;letter-spacing:0}
.tb .b#bHelp[aria-pressed="true"] .hq{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.tb .b#bAgent{color:var(--faint)}
.tb .b#bAgent[aria-pressed="true"]{color:var(--agent)}
.tb .b#bSound.live{color:var(--you)}
/* wordmark: the mark cycles on click (logo shortlist); the word opens the world menu */
.wm{display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;flex:none;color:var(--ink)}
.wm .logo{display:flex;align-items:center;justify-content:center;height:30px;min-width:30px;padding:0 2px;border-radius:2px}
.wm .logo:hover{background:var(--hov)}
.wm .nmw{display:flex;align-items:center;height:30px;padding:0 3px;color:var(--ink);border-radius:2px}
.wm .nmw:hover,.wm .nmw[aria-expanded="true"]{color:var(--acct)}
.wm .sub{display:none}

/* ---- shared controls: groove slider (SL3), groove toggle, groove stepper, segmented (SG1), roomy button (BT2) ---- */
.sl{position:relative;display:inline-flex;align-items:center;width:var(--slw,84px);height:16px;cursor:pointer;flex:none;touch-action:none;outline:none;--v:.5;vertical-align:middle}
.sl:focus-visible{box-shadow:0 0 0 1px var(--accent)}
.sl .tr{position:absolute;left:0;right:0;top:50%;height:5px;transform:translateY(-50%);background:var(--grv);border-radius:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06)}
.sl .fl{position:absolute;left:0;top:0;bottom:0;width:calc(var(--v)*100%);background:var(--accent);opacity:.85;border-radius:inherit;box-shadow:inset 0 1px 1px rgba(0,0,0,.3)}
.sl .th{position:absolute;left:calc(4.5px + var(--v)*(100% - 9px));top:50%;transform:translate(-50%,-50%);width:9px;height:14px;border-radius:2px;background:var(--cap) linear-gradient(var(--afl),var(--afl)) center/1px 6px no-repeat;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.3);pointer-events:none}
.sl.dis{opacity:.32;pointer-events:none}
.tgl{display:inline-block;position:relative;width:24px;height:13px;border-radius:7px;background:var(--grv);box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06);transition:background .12s;flex:none;cursor:pointer;vertical-align:middle}
.tgl::after{content:"";position:absolute;left:2px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--cap);box-shadow:0 1px 2px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s}
.tgl.on{background:var(--accent);box-shadow:inset 0 1px 1px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.3),0 0 7px color-mix(in srgb,var(--accent) 60%,transparent)}
.tgl.on::after{transform:translateX(11px);background:var(--cap);box-shadow:0 1px 1px rgba(0,0,0,.55)}
.tgl.dis{opacity:.35;pointer-events:none}
.stp{display:inline-flex;align-items:center;background:var(--grv);border-radius:4px;padding:2px;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);flex:none}
.stp button{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--cap);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 1px rgba(0,0,0,.5);font:600 12px/1 var(--mono)}
.stp b{min-width:26px;text-align:center;font:600 10.5px/1 var(--mono);color:var(--ink)}
.sgc{display:inline-flex;position:relative;background:var(--grv);border-radius:5px;padding:2px;box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06);flex:none}
.sgc button{flex:1 1 0;min-width:26px;height:18px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;color:var(--faint);font:600 11px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;position:relative;z-index:1}
.sgc button:hover{color:var(--ink)}
.sgc button.on{color:var(--acct)}
.sgc .ind{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));transform:translateX(calc(100% * var(--i)));border-radius:3px;background:var(--cap);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.5);transition:transform .18s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:22px;padding:0 15px;border-radius:4px;font:600 11px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;background:var(--cap);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.25);white-space:nowrap;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.on,.btn[aria-pressed="true"]{background:var(--grv);color:var(--acct);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.btn.sm{height:20px;padding:0 10px;font:500 10px/1 var(--mono);letter-spacing:0;text-transform:none}
.btn.go{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.25)}
.btn kbd{height:12px;min-width:12px;font-size:8.5px}
.btn.go kbd{background:var(--accent-ink);color:var(--accent)}
/* floating surface: everything that hovers over the stage (tips, toasts, speech) */
.float{background:var(--tipbg);color:var(--ink);box-shadow:0 0 0 var(--p) var(--pxo),inset var(--p) var(--p) 0 var(--pxl),calc(2*var(--p)) calc(2*var(--p)) 0 0 rgba(0,0,0,.4)}

/* ---- the stage ---- */
main{display:grid;grid-template-columns:minmax(0,1fr) var(--sbw);min-height:0}
body.sb-off{--sbw:36px}
#viewwrap{position:relative;min-width:0;min-height:0;background:var(--stage)}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:var(--stage);cursor:crosshair}
#stage.pan{cursor:grabbing}
canvas#view{position:absolute;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated;outline:none}
#ov{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;font:600 11px/1 var(--mono);padding:2px 5px;background:var(--agent);color:var(--agent-ink);white-space:nowrap;transform:translate(-9999px,0)}
.tag.off{background:var(--tipbg);color:var(--agent-t);box-shadow:inset 0 0 0 1px var(--agent)}
.tag.none{visibility:hidden}
/* claude's speech: a floating surface with claude's edge and a pixel tail */
.bubble{position:absolute;left:0;top:0;max-width:240px;font:500 11px/1.35 var(--mono);padding:5px 8px 5px 9px;transform:translate(-9999px,0);box-shadow:inset var(--p) 0 0 var(--agent),0 0 0 var(--p) var(--pxo),calc(2*var(--p)) calc(2*var(--p)) 0 0 rgba(0,0,0,.4)}
.bubble::after{content:"";position:absolute;left:10px;bottom:calc(-3*var(--p));width:calc(2*var(--p));height:calc(2*var(--p));background:var(--pxo);box-shadow:calc(-2*var(--p)) calc(2*var(--p)) 0 var(--pxo)}
.bubble.dim{opacity:.62}
.tip{position:absolute;left:0;top:0;font:500 11px/1.25 var(--mono);padding:4px 7px;white-space:nowrap;transform:translate(-9999px,0)}
.tip b{color:var(--acct);font-weight:600}
#toolLayer{position:absolute;inset:0;pointer-events:none;z-index:7}
#toolLayer>*{pointer-events:auto}

/* ---- tool palette (decided): thumb cycles collapsed / groups / all tools; names on approach ---- */
#tools{position:absolute;left:8px;top:8px;z-index:6;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
#tools .grp{display:flex;flex-direction:column;position:relative}
#tools .grp+.grp{border-top:var(--p) solid var(--pxo);box-shadow:inset 0 var(--p) 0 var(--pxl)}
#tools .grp[hidden]{display:none}
.tl-thumb{display:flex;align-items:center;justify-content:center;gap:3px;width:100%;min-width:44px;height:16px;color:var(--faint);position:relative}
.tl-thumb i{width:5px;height:5px;background:currentColor;opacity:.5}
.tl-thumb i.on{background:var(--accent);opacity:1}
.tl-thumb:hover{color:var(--ink)}
.tls0 .tl-thumb{height:22px;width:48px}
.tool{position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.tool .ic{display:block;width:30px;height:22px;flex:none}
.tool .ic img{display:block;width:30px;height:22px;image-rendering:pixelated}
.tool:hover{background:var(--hov)}
.tool[aria-pressed="true"]{background:var(--pxd) var(--dith);box-shadow:var(--press),inset calc(2*var(--p)) 0 0 var(--you)}
body[data-mt="11"] .tool[aria-pressed="true"],body[data-mt="15"] .tool[aria-pressed="true"]{background:var(--pxm) var(--dith)}
.tool .tri{position:absolute;right:2px;bottom:2px;width:0;height:0;border-left:4px solid transparent;border-bottom:4px solid var(--faint);pointer-events:none}
.tool[aria-pressed="true"] .tri{border-bottom-color:var(--you)}
.tool .lb{display:flex;align-items:center;gap:5px;font:600 12px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.tool .lb .new{font:600 8px/1 var(--mono);color:var(--acct);letter-spacing:0;text-transform:none}
/* state 2: an icon strip, the names float to the right */
.tls2 .tool{width:40px;height:32px}
.tls2 .tool .lb,.tl-thumb .lb{position:absolute;left:calc(100% + 7px);top:50%;transform:translate(-5px,-50%);opacity:0;padding:4px 7px 4px 6px;background:var(--pxf);box-shadow:0 0 0 var(--p) var(--pxo),inset var(--p) var(--p) 0 var(--pxl),var(--p) var(--p) 0 0 rgba(0,0,0,.4);color:var(--ink);transition:opacity .12s,transform .14s;transition-delay:calc(var(--i,0)*14ms);display:flex;align-items:center;gap:5px;font:600 12px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.tl-thumb .lb{color:var(--dim)}
.tl-near #tools .tl-thumb .lb,.tl-near .tls2 .tool .lb{opacity:1;transform:translate(0,-50%)}
/* state 1 and opened group rows: names appear under the icons */
.tls1 .tool,.grow .tool{flex-direction:column;justify-content:center;width:52px;height:44px}
.tls1 .tool .ic,.grow .tool .ic{transition:transform .14s}
.tls1 .tool .lb,.grow .tool .lb{position:absolute;left:-6px;right:-6px;bottom:4px;justify-content:center;font-size:10.5px;letter-spacing:.05em;opacity:0;transition:opacity .12s}
.tl-near .tls1 .tool .ic,.tl-near .grow .tool .ic{transform:translateY(-6px)}
.tl-near .tls1 .tool .lb,.tl-near .grow .tool .lb{opacity:1}
.tls1 .tool .sc{position:absolute;right:3px;top:50%;margin-top:-4px;color:var(--faint);display:flex;transition:transform .15s}
.tls1 .tool.open .sc{color:var(--acct);transform:scaleX(-1)}
.tls1 .tool.open{background:var(--hov)}
.tls1 .tool[aria-pressed="true"],.grow .tool[aria-pressed="true"]{box-shadow:var(--press),inset 0 calc(-2*var(--p)) 0 var(--you)}
.grow{position:absolute;display:flex;flex-direction:row}
.grow .tool+.tool{border-left:var(--p) solid var(--pxo)}
.grow .tool>kbd{position:absolute;right:3px;top:3px;opacity:0;transition:opacity .12s}
.tl-near .grow .tool>kbd{opacity:.95}
.tls0 .grp:not(.gthumb){display:none}
/* option flyouts (FO2 strip, persistent): the same tool again, the × or Esc closes them */
.fo{position:absolute;padding:5px 9px 8px;display:flex;flex-direction:column;gap:6px;font-size:11px;min-width:150px}
.fo .foh{display:flex;align-items:center;justify-content:space-between;gap:14px;font:700 11px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 -9px;padding:4px 5px 5px 9px}
.fo .fx{width:18px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--faint)}

.fo .r{display:flex;flex-direction:column;gap:3px}
.fo .cap{font:600 10.5px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:flex;gap:6px;align-items:center}
.fo .cap b{color:var(--ink);font-weight:600}
.fo .tiles{display:flex;box-shadow:0 0 0 var(--p) var(--pxo);align-self:flex-start}
.fo .tile{display:flex;align-items:center;justify-content:center;width:44px;height:28px;background:var(--pxb);box-shadow:var(--bsh)}

.fo .tile:hover{background:var(--pxbh)}
.fo .tile.on{background:var(--pxf) var(--dith);box-shadow:var(--press),inset 0 calc(-2*var(--p)) 0 var(--accent)}
.fo .tile .sw{width:40px;height:24px;image-rendering:pixelated}
.fo .tile .swt{font:600 15px/1 var(--mono);color:var(--ink)}
.fo .acts{display:flex;gap:4px;padding-top:6px;border-top:var(--p) solid var(--pxo);box-shadow:inset 0 var(--p) 0 var(--pxl);margin:0 -9px;padding-left:6px}
.fo .acts kbd{margin-left:2px}
.fo .note{font-size:10px;color:var(--faint);line-height:1.3;max-width:230px;white-space:normal}
.hue-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hue-t{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 0;color:var(--dim);font-size:11px;white-space:nowrap}
.hue-t:hover{color:var(--ink)}
.hue-t .cap{font:600 10.5px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.hue{display:block;width:12px;height:12px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.hue.auto{background:conic-gradient(#5fd3c4 0 33%,#9b87e8 0 66%,#a9cf56 0)}   /* raw-colour: the hues themselves */
.hues{display:flex;gap:3px}
.hues button{width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.hues button.on{box-shadow:0 0 0 1px var(--ink)}
.fcon{position:absolute;height:1px;background:var(--accent);opacity:.55;pointer-events:none!important}
.fcon::after{content:"";position:absolute;right:-2px;top:-2px;width:5px;height:5px;background:var(--accent);border-radius:50%}

/* ---- levels panel (decided): ruler <-> expanded, window on the cut, floor grabber ---- */
#strip{position:absolute;right:8px;top:8px;z-index:6;width:206px;user-select:none;-webkit-user-select:none}
#strip.lvc{width:54px}
.lv-h{display:flex;align-items:center;gap:6px;padding:3px 5px;min-height:24px}
.lv-tg{width:20px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--faint);flex:none}
.lv-tg:hover{color:var(--ink)}
.lv-h .cutv{flex:1;min-width:0;font:600 11px/1 var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-h .cutv b{color:var(--acct)}
.lvc .lv-h{justify-content:center}
.lvc .lv-h .cutv{display:none}
#thumb{display:block;width:100%;height:54px;image-rendering:pixelated;cursor:crosshair;border-bottom:var(--p) solid var(--pxo);background:#101113}   /* raw-colour: part of the scene, not the chrome */
.lvc #thumb{display:none}
.lv-win{position:relative;max-height:var(--lvh,260px);overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 7px,#000 calc(100% - 7px),transparent);mask-image:linear-gradient(transparent 0,#000 7px,#000 calc(100% - 7px),transparent)}   /* raw-colour: a mask, not a colour */
#levels{list-style:none;margin:0;padding:4px 0;position:relative;outline:none;cursor:pointer}
#levels:focus-visible{box-shadow:inset 0 0 0 var(--p) var(--accent)}
#levels .row{display:grid;grid-template-columns:28px 1fr 30px 6px;align-items:center;gap:5px;height:16px;padding:0 7px;font:500 10.5px/16px var(--mono);color:var(--dim);position:relative}
#levels .row .c{font-weight:600;color:var(--ink)}
#levels .row .n{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#levels .row .f{height:4px;background:var(--well);position:relative}
#levels .row .f i{position:absolute;left:0;top:0;bottom:0;background:var(--fillc)}
#levels .row .f::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--tick);opacity:.7}
#levels .row.over .f i{background:var(--bad)}
#levels .row .a{width:6px;height:6px}
#levels .row.ag .a{background:var(--agent)}
#levels .row:hover{background:var(--hov);color:var(--ink)}
#levels .row.above,#levels .row.out{background-image:var(--dith)}
#levels .row.above>*{opacity:var(--fade)}
#levels .row.out>*{opacity:.24}
#levels .row.above .f i,#levels .row.out .f i{background:transparent;box-shadow:inset 0 0 0 1px var(--fillc)}
#levels .row.cut{background:var(--sel);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
#levels .row.cut .c{color:var(--acct)}
#levels .gl{height:0;border-top:var(--p) dashed var(--faint);margin:3px 7px;opacity:.6}
#levels .row .nl{display:none}
.lv-cut{position:absolute;left:0;right:0;height:2px;margin-top:-1px;background:var(--accent);transition:top .14s cubic-bezier(.3,.7,.4,1);z-index:3;pointer-events:none}
.lv-floor{display:none;position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--ink);z-index:3;pointer-events:none}
.hasfloor .lv-floor{display:block}
.lv-grab{display:flex;align-items:center;justify-content:center;width:100%;height:13px;cursor:ns-resize;color:var(--faint);touch-action:none;position:relative}
.lv-grab i{width:20px;height:1px;background:currentColor;box-shadow:0 3px 0 currentColor;margin-top:-3px}
.lv-grab:hover,#strip.dragging .lv-grab,.hasfloor .lv-grab{color:var(--acct)}
.lv-grab .fv{position:absolute;right:6px;top:2px;font:500 9px/1 var(--mono);color:var(--dim)}
.lvc .lv-grab .fv{display:none}
.lvc #levels .row{grid-template-columns:1fr 5px;padding:0 5px 0 7px;height:15px;font-size:10px;gap:4px}
.lvc #levels .row .n,.lvc #levels .row .a{display:none}
.lvc #levels .row .f{height:8px;width:4px;align-self:center}
.lvc #levels .row .f i{left:auto;right:0;width:100%!important;bottom:0;top:auto;height:var(--fh)}
.lvc #levels .row .f::after{display:none}
.lvc #levels .row.ag .c::after{content:"";display:inline-block;width:4px;height:4px;background:var(--agent);margin-left:3px;vertical-align:middle}
.lvc #levels .row .nl{display:block;position:absolute;right:calc(100% + 8px);top:50%;transform:translate(5px,-50%);opacity:0;pointer-events:none;white-space:nowrap;font:500 10.5px/1 var(--mono);color:var(--ink);background:var(--pxf);padding:2px 5px;box-shadow:0 0 0 var(--p) var(--pxo);transition:opacity .1s,transform .12s}
.lvc.near #levels .row .nl{opacity:1;transform:translate(0,-50%)}
.lvc.near #levels .row.above .nl,.lvc.near #levels .row.out .nl{opacity:.45}
.lvc .lv-win{overflow:visible;clip-path:inset(0 0 0 -400px);-webkit-mask-image:none;mask-image:none}

/* ---- status bar (BB3: current tool's keys, zoom stepper) ---- */
#status{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;height:28px;padding:var(--p) 8px 0;font-size:11px;z-index:5;white-space:nowrap;overflow:hidden;background:var(--pxf);box-shadow:inset 0 var(--p) 0 var(--pxo),inset 0 calc(2*var(--p)) 0 var(--pxl);color:var(--ink)}

#hover{color:var(--ink);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:40px}

/* ---- toast ---- */
#toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);padding:5px 10px;font-size:11px;z-index:9;max-width:80%}
#toast[hidden]{display:none}

/* ---- agent sidebar (decided: unified feed + filter; collapses to the slim rail) ---- */
aside#side{display:flex;flex-direction:column;min-height:0;position:relative;z-index:4;border-left:var(--p) solid var(--pxo);box-shadow:var(--barsh),inset var(--p) 0 0 var(--pxl);font-size:11px;overflow:hidden}
.sb-h{display:flex;align-items:center;gap:7px;padding:0 6px 0 10px;height:30px;flex:none}
.sb-h b{font:700 13px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.sb-h .clawd{color:var(--agent);display:flex}
.sb-h .state{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:10px}
.sb-h .state i{width:6px;height:6px;background:var(--agent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.sb-h .ibtn{margin-left:auto;width:26px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.sb-h .ibtn:hover{color:var(--ink);background:var(--hov)}
.sb-f{display:flex;align-items:center;gap:6px;padding:6px 10px 3px}
.sb-f .sp{flex:1}
.sb-f .who{display:flex;align-items:center;gap:4px;color:var(--faint);font-size:9.5px}
.sb-body{display:flex;flex-direction:column;flex:1;min-height:0}
#feed{list-style:none;margin:0;padding:8px 10px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;scrollbar-width:thin}
#feed .lg{font-size:10px;color:var(--faint);display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 5px;line-height:13px}
#feed .lg .who{flex:none;width:14px;height:13px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
#feed .lg.claude .who,#feed .m.ai .who{color:var(--agent)}
#feed .lg.you .who{color:var(--you)}
#feed .lg .ic{flex:none;width:16px;height:13px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
#feed .lg .ic img{image-rendering:pixelated}
#feed .lg .ic img.rm{opacity:.45;filter:grayscale(1)}
#feed .lg .hd{flex:1 1 0;min-width:0}
#feed .lg>time{flex:none;font-size:9px;color:var(--faint);opacity:.75}
#feed .at{color:var(--dim);cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px;white-space:nowrap}   /* a place: in log rows, messages and proposals alike */
#feed .at:hover,#feed .at:focus-visible{color:var(--ink);text-decoration-style:solid;outline:none}
#feed .lg .cnt,#feed .lg .chev{display:none}
#feed .lg.grp .hd{cursor:pointer}
#feed .lg.grp .cnt{display:inline-block;margin-left:5px;padding:0 4px;color:var(--ink);background:var(--hov);font-weight:600}
#feed .lg.grp .chev{display:inline-block;width:8px;margin-left:3px;color:var(--faint);font-style:normal}

#feed .lg .sub{list-style:none;margin:1px 0 3px 40px;padding:0;display:none;color:var(--faint);flex-basis:100%}

#feed .lg .sub li{display:flex;gap:6px}
#feed .lg .sub li>span{min-width:26px}
#feed .lg .sub time{margin-left:auto;font-size:9px;opacity:.75}
.ibtn.mute i{display:inline-block;width:8px;height:9px;border-left:3px solid currentColor;border-right:3px solid currentColor;box-sizing:border-box}
.ibtn.mute[aria-pressed="true"]{color:var(--agent)}
.ibtn.mute[aria-pressed="true"] i{width:0;height:0;border:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.gcon{position:absolute;height:1px;background:var(--accent);opacity:.55;pointer-events:none!important}
.fcon.v{width:1px!important}
.fcon.v::after{right:-2px;top:auto;bottom:-2px}
#feed .lg:hover,#feed .lg.new{color:var(--dim)}
/* messages: the log's row, in the reading size; who in its colour, the words in ink */
#feed .m{display:flex;align-items:flex-start;gap:0 5px;padding:4px 0 5px;font-size:11px;line-height:15px;color:var(--ink);border-top:1px solid var(--hov);border-bottom:1px solid var(--hov)}
#feed .m+.m{border-top:0}
#feed .m .who{flex:none;width:14px;height:15px;display:flex;align-items:center;justify-content:center}

#feed .m.me .who{color:var(--you)}
#feed .m .tx{flex:1 1 0;min-width:0}

/* a proposal: asks in the feed, stays in view until answered, then folds to one line (click to open) */
#feed .pr{flex:none;position:relative;font-size:10px;line-height:13px;color:var(--dim);background:var(--field);box-shadow:inset var(--p) 0 0 var(--agent);padding:5px 6px 6px 0}
#feed .pr.you{box-shadow:inset var(--p) 0 0 var(--you)}
#feed .pr.pending{position:sticky;top:0;bottom:0;z-index:2;box-shadow:inset var(--p) 0 0 var(--agent),0 0 0 1px var(--pxo)}
#feed .pr .prh{display:flex;align-items:flex-start;gap:0 5px;cursor:pointer}
#feed .pr.pending .prh{cursor:default}
#feed .pr .who{flex:none;width:14px;height:13px;margin-left:2px;display:flex;align-items:center;justify-content:center;color:var(--agent)}
#feed .pr .ic{flex:none;width:16px;height:13px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
#feed .pr .hd{flex:1 1 0;min-width:0;color:var(--ink)}

#feed.f-log .m,#feed.f-chat .lg,#feed.f-band .pr:not(.pending){display:none}
/* ---- the band: bot chatter in the feed, drawn in pixels (88_band.js) ---- */

#bandPop .row .sl{--slw:auto;width:100%}
#bandPop .row .v{text-align:right;color:var(--faint);font-size:10px}
#bandPop .lp-h .lp-dim{margin-left:auto;margin-right:8px}
#bandPop .foot{display:flex;align-items:center;gap:6px;border-top:var(--p) solid var(--pxo);box-shadow:inset 0 var(--p) 0 var(--pxl);margin-top:6px;padding:6px 9px 2px;color:var(--faint);font-size:9.5px}
#bandPop .foot span{flex:1}
#chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px}
#chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 2px 2px 6px;box-shadow:inset 0 0 0 1px var(--you-t);color:var(--you-t);background:var(--you-wash)}
.chip button{color:inherit;padding:0 4px;line-height:1}
#sugg{display:flex;flex-wrap:wrap;gap:6px 2px;padding:6px 7px 4px}
#chatf{display:flex;align-items:center;margin:4px 10px 10px;background:var(--field);box-shadow:inset var(--p) var(--p) 0 var(--pxo),inset calc(-1*var(--p)) calc(-1*var(--p)) 0 var(--pxl)}
#chatf input{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:7px 8px;font-size:11px;color:var(--ink)}
#chatf input::placeholder{color:var(--faint)}
#chatf button{width:30px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
#chatf button:hover{color:var(--acct)}
.sb-rail{display:none;flex-direction:column;align-items:center;gap:2px;padding-top:4px}
.sb-rail .rb{width:32px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--faint);position:relative}
.sb-rail .rb:hover{color:var(--ink);background:var(--hov)}
.sb-rail .rb.cl{color:var(--agent)}
.sb-rail .badge{position:absolute;right:2px;top:4px;min-width:12px;height:12px;padding:0 2px;font:700 8.5px/12px var(--mono);text-align:center;background:var(--agent);color:var(--agent-ink)}
.sb-rail .badge:empty{display:none}
.sb-rail .rdot{position:absolute;right:6px;top:7px;width:5px;height:5px;background:var(--agent);animation:pulse 1.6s infinite}
.sb-rail .rb.cl.ask .rdot{display:none}
.sb-rail .rb.cl.ask::after{content:"?";position:absolute;right:1px;top:3px;min-width:12px;height:12px;font:700 8.5px/12px var(--mono);text-align:center;background:var(--agent);color:var(--agent-ink);animation:pulse 1.6s infinite}
body.sb-off .sb-rail{display:flex}
body.sb-off .sb-body{display:none}
body.noagent aside#side,body.noagent .tag,body.noagent .bubble,body.noagent [data-tool="point"]{display:none!important}
body.noagent main{grid-template-columns:minmax(0,1fr)}

/* ---- popovers: light settings (LT1), world menu, keys ---- */
.popm{position:fixed;z-index:50;width:250px;font:500 11px/1.25 var(--mono);color:var(--ink);padding-bottom:4px}
.popm[hidden]{display:none}
.popm .lp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 9px;font:700 11px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.popm .lp-sub{font:700 10px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:9px 9px 4px;display:flex;justify-content:space-between}
.popm .lp-dim{color:var(--faint);font:500 10px/1 var(--mono);letter-spacing:0;text-transform:none}
.popm .lp-row{display:flex;align-items:center;gap:8px;padding:3px 9px;min-height:26px}
.popm .lp-note{flex:1;color:var(--dim);font-size:10px;line-height:1.25;min-width:0}
.popm .lp-slot{width:12px;color:var(--acct);font-weight:600}
.popm .lp-btns{display:flex;gap:4px}
.sgc.dis{opacity:.4;pointer-events:none}
.popm .lp-kv{display:flex;justify-content:space-between;padding:2px 9px;color:var(--dim)}
.popm .lp-kv b{color:var(--ink);font-weight:500}
.popm .lp-sw{display:flex;align-items:center;gap:8px;cursor:pointer}
#lightPop .sgc{display:flex;margin:7px 9px 5px}
#lightPop .rows{display:flex;flex-direction:column;padding:0 6px}
#lightPop .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:2px 3px;min-height:24px;color:var(--dim)}
#lightPop .row.on{color:var(--ink)}
#lightPop .row .rt{display:flex;align-items:center;gap:6px;cursor:pointer;min-width:64px}
#lightPop .row .px{color:var(--faint)}
#lightPop .row.on .px{color:var(--acct)}
#lightPop .row .sl{--slw:auto;width:100%}
#lightPop .foot{display:flex;align-items:center;gap:10px;border-top:var(--p) solid var(--pxo);box-shadow:inset 0 var(--p) 0 var(--pxl);margin-top:4px;padding:6px 9px 2px;color:var(--faint);font-size:9.5px}
#lightPop .foot .btn{margin-left:auto}
#worldPop{width:340px}
#worldPop .btn{height:20px;padding:0 10px}
#keysPop[hidden]{display:none}
#keysPop{width:min(760px,calc(100vw - 16px));display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;padding:8px 12px 10px}
#keysPop .lp-h{grid-column:1/-1;padding:2px 0 6px}
#keysPop h4{margin:4px 0;font:700 11px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
#keysPop .kr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:baseline;color:var(--dim);padding:1px 0}
#keysPop .kr b{display:flex;flex-wrap:wrap;align-items:center;gap:2px 3px;color:var(--ink);font-weight:500}
#keysPop .kr .kw{display:inline-flex;align-items:center;gap:1px;white-space:nowrap}

/* ---- tooltips and help bubbles ---- */
#ctip{position:fixed;z-index:70;pointer-events:none;display:flex;align-items:center;gap:6px;padding:4px 7px;font:500 11px/1.2 var(--mono);white-space:nowrap;opacity:0;transition:opacity .08s;left:0;top:0}
#ctip.show{opacity:1}
#ctip b{font:600 12px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase}
#ctip .hint{color:var(--faint);font-size:10px}
#helpLayer{position:fixed;inset:0;z-index:60;pointer-events:none}
#helpLayer svg{position:absolute;left:0;top:0;overflow:visible}
#helpLayer line{stroke:var(--accent);stroke-width:1}
#helpLayer circle{fill:var(--accent);stroke:var(--accent-ink);stroke-width:1}
.hbub{position:absolute;max-width:180px;padding:4px 7px 5px;background:var(--accent);color:var(--accent-ink);font:500 10.5px/1.32 var(--mono);box-shadow:0 0 0 var(--p) var(--accent-ink),var(--p) var(--p) 0 var(--p) rgba(0,0,0,.35)}
.hbub b{font-weight:700}
.hbub kbd{background:var(--accent-ink);color:var(--accent)}

/* ---- narrow screens: the bar wraps, the stage keeps the overlays, the agent goes below ---- */
@media (max-width:860px){
  body{overflow-x:hidden;overflow-y:auto}
  #app{height:auto;min-height:100%;display:block}
  header.tb{height:auto;flex-wrap:wrap;row-gap:var(--p)}
  header.tb>*{height:34px}
  .tb .fill{display:none}
  .tb .b.mode .lb{display:none}
  .tb .b.mode{padding:0 9px}
  main{display:block}
  #viewwrap{height:66vh;min-height:340px}
  aside#side{height:auto;min-height:300px;border-left:0;border-top:var(--p) solid var(--pxo)}
  body.sb-off aside#side{min-height:0}
  body.sb-off .sb-rail{flex-direction:row;padding:2px 6px}
  #feed{max-height:260px}
  #viewinfo,#hints{display:none}
  #keysPop{width:calc(100vw - 16px);grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

<script>
'use strict';
/* ==========================================================================
   SPALL (working title; was Stratum) — layer-view study for an isometric megastructure builder.

   ========================================================================== */

// ---------- world constants ----------
const W = 64, D = 64, NL = 30, G = 2;          // footprint, levels, ground index (L0)
const LH = 12, HT = 7;                           // level height px, cut height px (plan cut ~0.6 storey)
const CW = (W + D) * 8 + 16, CH = (W + D) * 4 + 40, OX = D * 8 + 8, OY = 36;     // per-level cache canvas + anchor origin
const GAP = 44;                                  // exploded gap between strata (px)
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const LEVELS = [
  ['B2', 'cistern'], ['B1', 'undercroft'], ['L0', 'street'], ['L1', 'arcade'],
  ['L2', 'lower infill'], ['L3', 'rooftop passages'], ['L4', 'transit deck'], ['L5', 'habitation'],
  ['L6', 'tube crossing'], ['L7', 'sky garden'], ['L8', 'habitation'], ['L9', 'habitation'],
  ['L10', 'upper transit'], ['L11', 'habitation'], ['L12', 'canopy'], ['L13', 'canopy walk'],
  ['L14', 'crown'], ['L15', 'crane deck'],
  // above the generated city: room for upper cities, lids and spires
  ['L16', 'high habitation'], ['L17', 'high habitation'], ['L18', 'high transit'], ['L19', 'high habitation'],
  ['L20', 'high habitation'], ['L21', 'high habitation'], ['L22', 'high canopy'], ['L23', 'high canopy'],
  ['L24', 'spire'], ['L25', 'spire'], ['L26', 'spire'], ['L27', 'sky']
].map(([code, name], z) => ({ code, name, z }));
const STRATA = [[0, 1, 'undercroft'], [2, 3, 'street + arcade'], [4, 5, 'lower infill'], [6, 6, 'transit deck'],
  [7, 8, 'habitation'], [9, 9, 'sky garden'], [10, 11, 'habitation'], [12, 12, 'upper transit'],
  [13, 13, 'habitation'], [14, 15, 'canopy'], [16, 17, 'crown'],
  [18, 20, 'high habitation'], [21, 23, 'high habitation'], [24, 25, 'high canopy'], [26, 29, 'spire']];
const STRATUM_OF = new Int8Array(NL);
STRATA.forEach((s, i) => { for (let z = s[0]; z <= s[1]; z++) STRATUM_OF[z] = i; });
const lvCode = z => LEVELS[z] ? LEVELS[z].code : '?';

// ---------- rng / hash ----------
function mulberry32(a) {

    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);

    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash3(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 1274126177) | 0;
  h = Math.imul(h ^ (h >>> 13), 1103515245);
  return (h ^ (h >>> 16)) >>> 0;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
let rr = mulberry32(99);   // runtime rng (reseeded on generate)

// ---------- colour ----------
const _rgb = new Map();
function rgbOf(hex) {
  let c = _rgb.get(hex);
  if (!c) { const n = parseInt(hex.slice(1), 16); c = [n >> 16 & 255, n >> 8 & 255, n & 255]; _rgb.set(hex, c); }
  return c;
}
function hexOf(r, g, b) { return '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1); }
function mixHex(a, b, t) { const A = rgbOf(a), B = rgbOf(b); return hexOf(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }

// time-of-day face multipliers: top / left (sun side at dusk) / right (shadow side)
const TODS = {
  day:   { t: [1.00, 0.99, 0.95], l: [0.97, 0.96, 0.93], r: [0.78, 0.81, 0.84], lit: 0.10, name: 'Day' },
  dusk:  { t: [0.84, 0.69, 0.58], l: [1.00, 0.74, 0.54], r: [0.50, 0.47, 0.50], lit: 0.46, name: 'Dusk' },
  night: { t: [0.30, 0.33, 0.37], l: [0.27, 0.29, 0.33], r: [0.20, 0.22, 0.26], lit: 0.66, name: 'Night' }
};
const LQ = [0.40, 0.54, 0.69, 0.85, 1.0, 1.12, 1.24];   // baked sky-light quantised (5, 6: sunlit, live lighting only)
function shadeRGB(hex, face, q) {

}

// ---------- tiny 3x5 pixel font ----------
const FONT = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010',
  K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010',
  P: '110101110100100', Q: '010101101111011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
  Z: '111001010100111', 0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
  4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010', 8: '111101111101111',
  9: '111101111001110', '.': '000000000000010', ',': '000000000010100', ':': '000010000010000', '-': '000000111000000',
  '+': '000010111010000', '/': '001001010100100', '(': '010100100100010', ')': '010001001001010', '%': '101001010100101',
  '#': '101111101111101', '>': '100010001010100', '<': '001010100010001', '=': '000111000111000', '_': '000000000000111',
  '|': '010010010010010', '[': '110100100100110', ']': '011001001001011', '↑': '010111010010010', '↓': '010010010111010',
  "'": '010010000000000', '@': '010101111100011', '·': '000000010000000', '×': '000101010101000', '*': '000101010101000',
  '!': '010010010000010', '?': '110001010000010', '▽': '111101010000000'

function ptext(g, s, x, y, col, shadow, sc) {

  let cx = x | 0; y |= 0;

    const f = FONT[ch];
    if (f) for (let i = 0; i < 15; i++) if (f.charCodeAt(i) === 49) g.fillRect(cx + (i % 3) * sc, y + (i / 3 | 0) * sc, sc, sc);

}

const ROLE = { agent: '#ff7a52', agentHi: '#ffb08f', agentInk: '#2a0f06', you: '#5fd3f2', accent: '#e8a83c', accentInk: '#1b1305',
  plate: '#1c1b18', plateInk: '#d9d2c2', plateRim: '#4f4a41' };   // plate*: a neutral label in the scene, the dark chrome's warm greys
const ptextW = (s, sc) => (String(s).length * 4 - 1) * (sc || 1);
function plate(g, s, x, y, bg, fg, border) {   // pixel label on a plate
  const w = ptextW(s) + 4;
  if (border) { g.fillStyle = border; g.fillRect(x - 1, y - 1, w + 2, 9); }
  g.fillStyle = bg; g.fillRect(x, y, w, 7);
  ptext(g, s, x + 2, y + 1, fg);

}

// ---------- element types ----------
const T = { EMPTY: 0, EARTH: 1, ROCK: 2, WATER: 3, STREET: 4, WALK: 5, OLD: 6, CORE: 7, LIFT: 8, TRUSS: 9, DECK: 10,
  TUBE: 11, FRAME: 12, CAPSULE: 13, TERRACE: 14, TREE: 15, PILLAR: 16, PIPE: 17, TANK: 18, VENT: 19, CANOPY: 20,
  ROOFWALK: 21, ANTENNA: 22, CRANE: 23, VAULT: 24, RISER: 25, LAMP: 26 };
// cat: support | infill | circ | land | util | earth ; op = light opacity ; poche = drawn as cut solid ; walk ; orient = has axis bit
const TI = [];
function defT(id, name, cat, op, o) { TI[id] = Object.assign({ id, name, cat, op, poche: false, walk: false, orient: false, tall: false, slab: false }, o || {}); }
defT(0, 'open air', 'void', 0);
defT(1, 'earth', 'earth', 1, { poche: true });
defT(2, 'bedrock', 'earth', 1, { poche: true });
defT(3, 'water', 'land', 0.1, { slab: true });
defT(4, 'street', 'circ', 0.9, { walk: true, slab: true, orient: true });
defT(5, 'plaza paving', 'circ', 0.9, { walk: true, slab: true });
defT(6, 'old building', 'infill', 1, { poche: true, tall: true });
defT(7, 'megacolumn core', 'support', 1, { poche: true, tall: true });
defT(8, 'lift shaft', 'support', 1, { poche: true, tall: true });
defT(9, 'transfer truss', 'support', 0.3, { tall: true });
defT(10, 'transit deck', 'circ', 0.85, { walk: true, slab: true, orient: true });
defT(11, 'enclosed corridor', 'circ', 0.35, { orient: true, tall: true });
defT(12, 'support frame (empty bay)', 'support', 0.2, { tall: true });
defT(13, 'habitation capsule', 'infill', 1, { poche: true, tall: true });
defT(14, 'garden terrace', 'land', 0.9, { walk: true, slab: true });
defT(15, 'tree', 'land', 0.55, { tall: true });
defT(16, 'deck pillar', 'support', 0.1, { tall: true });
defT(17, 'utility pipes', 'util', 0.3, { orient: true });
defT(18, 'cistern tank', 'util', 1, { poche: true, tall: true });
defT(19, 'vent stack', 'util', 0.4);
defT(20, 'solar canopy', 'util', 0.6);
defT(21, 'rooftop walkway', 'circ', 0.5, { walk: true, slab: true, orient: true });
defT(22, 'antenna mast', 'util', 0.05, { tall: true });
defT(23, 'gantry crane (drone depot)', 'util', 0.2, { tall: true });
defT(24, 'cistern column', 'support', 0.2, { tall: true });
defT(25, 'service riser', 'util', 0.3, { tall: true });
defT(26, 'lamp post', 'util', 0.02);
const PHASE_OF = t => { const c = TI[t].cat; return (c === 'support' || c === 'circ') ? 0 : c === 'infill' ? 1 : 2; };
const PHASE_NAME = ['structure', 'infill', 'fit-out'];
const isCirc = t => t && TI[t].cat === 'circ';

// ---------- world storage ----------
const NCELL = W * D * NL;
const cells = new Uint8Array(NCELL), vars = new Uint8Array(NCELL), flags = new Uint8Array(NCELL), light = new Float32Array(NCELL);
const F_WELL = 1, F_SIGN = 2, F_GRATE = 4;
const idx = (x, y, z) => (z * D + y) * W + x;
const inb = (x, y, z) => x >= 0 && y >= 0 && z >= 0 && x < W && y < D && z < NL;
const cell = (x, y, z) => inb(x, y, z) ? cells[idx(x, y, z)] : 0;
let WORLD = { cores: [], paths: [], wells: [], lifts: [], emitters: [], crane: null, fill: new Float32Array(NL), cistern: null };

// ---------- global UI/view state ----------
const S = {
  seed: 1729, mode: 'cut', level: 6, cutAnim: 6, cutFrom: 6, cutT: 1,
  explode: 0, explodeTarget: 0, ghost: false, shade: true, follow: false, tod: 'dusk', rot: 0, zoom: 2,
  cam: { x: 0, y: 120 }, camTarget: null, planCam: { x: 0, y: 0 }, secCam: { x: 0, y: 0 },
  floor: -1, hover: null, hoverStratum: -1, isoZoom: 2, safeL: 0, safeR: 0, cssW: 800, cssH: 600, tool: 'inspect', toolRot: 0, unit: null, captureH: 2, capture: null,
  secAxis: 'x', secIdx: 24, pins: [], time: 0, paused: false, bw: 400, bh: 300
};

// ---------- rotation (view turns in 90° steps) ----------
function toRot(x, y) {
  switch (S.rot) { case 1: return [D - 1 - y, x]; case 2: return [W - 1 - x, D - 1 - y]; case 3: return [y, W - 1 - x]; default: return [x, y]; }
}
function fromRot(u, v) {
  switch (S.rot) { case 1: return [v, D - 1 - u]; case 2: return [W - 1 - u, D - 1 - v]; case 3: return [W - 1 - v, u]; default: return [u, v]; }
}
function toRotF(px, py) {   // continuous point
  switch (S.rot) { case 1: return [D - py, px]; case 2: return [W - px, D - py]; case 3: return [py, W - px]; default: return [px, py]; }
}
function cellR(u, v, z) { if (u < 0 || v < 0 || u >= W || v >= D || z < 0 || z >= NL) return 0; const p = fromRot(u, v); return cells[idx(p[0], p[1], z)]; }

const screenAxis = a => (a ^ (S.rot & 1));

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function fmtTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
const $ = id => document.getElementById(id);
// ==========================================================================
// World generation: old street grid, cores, decks, tubes, infill, gardens,
// canopy, light wells, undercroft. Seeded + deterministic.
// ==========================================================================
function setC(x, y, z, t, v) { if (!inb(x, y, z)) return; const i = idx(x, y, z); cells[i] = t; vars[i] = v || 0; }
const isEmpty = (x, y, z) => inb(x, y, z) && cells[idx(x, y, z)] === 0;
function coreAt(x, y) { for (const c of WORLD.cores) if (x >= c.x && x < c.x + c.s && y >= c.y && y < c.y + c.s) return c; return null; }
const coreCenter = c => [c.x + (c.s >> 1), c.y + (c.s >> 1)];
// something to stand on / hang from
function supportAt(x, y, z) {
  const b = cell(x, y, z - 1);
  if (b && b !== T.TREE && b !== T.WATER && b !== T.LAMP && b !== T.VENT && b !== T.ANTENNA) return true;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = cell(x + dx, y + dy, z); if (n === T.CORE || n === T.LIFT) return true; }

}

function generate(seed) {

  // 1. ground mass ------------------------------------------------------------
  for (let y = 0; y < D; y++) for (let x = 0; x < W; x++) { setC(x, y, 0, T.ROCK, hash3(x, y, 0) & 3 | 4); setC(x, y, 1, T.EARTH, hash3(x, y, 1) & 3); }

  location.hash.slice(1).split('&').forEach(function(kv){ if(!kv) return; var i = kv.indexOf('='); if (i < 0) { p[kv] = '1'; return; } p[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1)); });
  function report(){ var d = document.createElement('pre'); d.id = '__report'; d.style.cssText = 'position:absolute;left:-99999px;top:0'; d.textContent = 'ERRS:' + JSON.stringify(window.__errs) + ' STATE:' + JSON.stringify({mode: STRATUM.S.mode, level: STRATUM.S.level, jobs: STRATUM.JOBS().length, agent: STRATUM.AGENT.state, bw: STRATUM.S.bw, bh: STRATUM.S.bh, zoom: STRATUM.S.zoom, perf: window.__perf}); document.body.appendChild(d); }
  function run(){ try { if (Object.keys(p).length) window.STRATUM.test(p); } catch(e){ window.__errs.push('hook: ' + e.message + ' ' + (e.stack||'')); } setTimeout(report, 400); window.addEventListener('error', function(){ var o=document.getElementById('__report'); if(o) o.remove(); report(); }); }
  function go(){ (window.__booted || Promise.resolve()).then(function(){ setTimeout(run, 60); }); }   // boot is async: wait for it
  if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
})();
</script>
