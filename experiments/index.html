<style>
:root{
  color-scheme:dark;
  --bg:#0e0f11; --panel:#161513; --panel2:#1c1b18; --line:#38342e; --hi:#4f4a41; --lo:#0b0a09;
  --ink:#e6dfcf; --dim:#a39c8e; --faint:#80796d; --acct:#e8a83c; --acct-ink:#1b1305; --you:#5fd3f2; --agent:#ff7a52;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cond:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:13px/1.5 var(--mono);padding:0 16px 64px}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto}
header{display:flex;align-items:flex-end;gap:22px;padding:40px 0 26px;border-bottom:2px solid var(--lo);box-shadow:0 2px 0 var(--line)}
header .mark{position:relative;width:84px;height:105px;flex:none;color:var(--ink)}
header .mark>svg{position:absolute;left:0;bottom:0}
header .mark>.p2{transform:translateY(-9px)}
header .mark>.p3{transform:translateY(-18px)}
header .wm{display:block;color:var(--ink);margin-bottom:6px}
h2{font:700 15px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--acct);margin:40px 0 4px}
.pn{background:var(--panel);box-shadow:0 0 0 2px var(--lo),inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo),3px 3px 0 2px rgba(0,0,0,.4)}
.th{display:block;aspect-ratio:16/10;background:#0a0b0c center/cover no-repeat;position:relative;overflow:hidden}
.th.none::after{content:attr(data-k);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font:600 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase}
/* the main build: two shots over a bar */
.main{margin-top:14px}
.main .shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--lo)}
.main .tx{padding:12px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px}
.main h3{font:700 26px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase;margin:0}
.main .links{margin:0;padding:0}
.play{display:inline-flex;align-items:center;gap:8px;margin-left:auto;padding:9px 18px;background:var(--acct);color:var(--acct-ink);text-decoration:none;font:700 15px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;box-shadow:inset 2px 2px 0 #ffd889,inset -2px -2px 0 #a3651a}
.play:hover{filter:brightness(1.08)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:14px}
.card{display:flex;flex-direction:column;text-decoration:none;min-width:0}
.card .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.card h3{font:700 20px/1.1 var(--cond);letter-spacing:.05em;text-transform:uppercase;margin:0}
.card p{margin:0;color:var(--dim)}
.card:hover h3,.card h3 a:hover{color:var(--acct)}
.links{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:auto;padding-top:4px;font-size:11.5px}
.links a{color:var(--you);text-decoration:none}
.links a:hover{text-decoration:underline}
.links a.ext::after{content:" ↗";color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px;color:var(--faint)}
.meta code{color:var(--dim)}
.tag{font:600 9.5px/1 var(--mono);padding:2px 4px;box-shadow:inset 0 0 0 1px var(--line);color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.tag.miss{color:var(--agent);box-shadow:inset 0 0 0 1px #6a3020}
.upd{color:var(--faint)}
.upd.fresh{color:var(--ink)}
footer{margin-top:44px;color:var(--faint);font-size:11.5px;border-top:2px solid var(--lo);box-shadow:0 -2px 0 var(--line);padding-top:16px}
footer code{color:var(--dim)}
footer a{color:var(--you);text-decoration:none}
@media (max-width:760px){
  header{gap:12px}
  header>div{flex:1;min-width:0}
  header .wm{width:100%;height:auto}
  .main .shots,.grid{grid-template-columns:1fr}
}
</style>
</head>

    desc: 'A rejected renderer study.' },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const isExt = h => /^https?:/.test(h);
// on this machine, "updated" is each file's time on disk; deployed, every file has the deploy's time, so it's left out
const LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const go = (h, cls) => `href="${esc(h)}"${cls ? ` class="${cls}"` : ''}${isExt(h) ? ' target="_blank" rel="noopener"' : ''}`;
function links(e) {
  const L = e.also || [];
  return L.length ? `<span class="links">${L.map(([n, h, k]) => `<a ${go(h, k === 'ext' ? 'ext' : '')} data-chk="${k === 'ext' ? '' : esc(h)}">${esc(n)}</a>`).join('')}</span>` : '';
}
function thumb(e, img) { return `<span class="th none" data-k="${esc(e.kind)}" data-img="home/${esc(img || e.id)}.jpg"></span>`; }
function meta(e) {
  return `<span class="meta"><span class="upd" data-upd="${esc(e.href || '')}"></span></span>`;
}
function card(e) {
  return `<div class="card pn" data-id="${esc(e.id)}"><a ${go(e.href)} data-main>${thumb(e)}</a><div class="tx"><h3><a ${go(e.href)} data-main style="text-decoration:none">${esc(e.title)}</a></h3><p>${esc(e.desc)}</p>${meta(e)}${links(e)}</div></div>`;
}
const M = ENTRIES.find(e => e.kind === 'main');
document.getElementById('mainCard').innerHTML = `<div class="main pn"><div class="shots">${M.shots.map(s => `<a ${go(M.href)}>${thumb(M, s)}</a>`).join('')}</div><div class="tx"><h3>${esc(M.title)}</h3>${meta(M)}${links(M)}<a class="play" ${go(M.href)}>Play ▸</a></div></div>`;
document.getElementById('buildGrid').innerHTML = ENTRIES.filter(e => e.kind === 'build').map(card).join('');
document.getElementById('studyGrid').innerHTML = ENTRIES.filter(e => e.kind === 'study').map(card).join('');
document.getElementById('archGrid').innerHTML = ENTRIES.filter(e => e.kind === 'archive').map(card).join('');

// thumbnails, if made
for (const el of document.querySelectorAll('.th[data-img]')) {
  const im = new Image();
  im.onload = () => { el.style.backgroundImage = `url("${el.dataset.img}")`; el.classList.remove('none'); };
  im.src = el.dataset.img;
}
const here = h => fetch(h, { method: 'HEAD' }).then(r => r.ok ? r : null, () => null);
// when each page last changed (the server's Last-Modified)
const ago = ms => { const m = ms / 60000; return m < 90 ? Math.max(1, Math.round(m)) + ' min ago' : m < 60 * 36 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; };
if (LOCAL) for (const el of document.querySelectorAll('[data-upd]')) {
  const h = el.dataset.upd; if (!h || isExt(h)) continue;
  here(h).then(r => {
    if (!r) { el.className = 'tag miss'; el.textContent = 'not here'; return; }
    const lm = r.headers.get('Last-Modified'); if (!lm) return;
    const d = Date.now() - new Date(lm).getTime(); el.textContent = 'updated ' + ago(d); if (d < 864e5) el.classList.add('fresh');
  });
}
// extra links to pages that aren't here are dropped
for (const a of document.querySelectorAll('a[data-chk]')) {
  const h = a.dataset.chk; if (h) here(h).then(r => { if (!r) a.remove(); });
}
</script>
</body>
</html>
